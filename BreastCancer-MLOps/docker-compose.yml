# Whole stack:   docker compose up --build
#   UI:  http://localhost:8501     API docs:  http://localhost:8000/docs
# Only the databases (for running api/ui from your venv):
#   docker compose up -d postgres redis
x-app-build: &app-build
  context: .
  args:
    PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    INSTALL_TORCH: ${INSTALL_TORCH:-0}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cancer
      POSTGRES_PASSWORD: cancer
      POSTGRES_DB: cancerdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancer -d cancerdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: *app-build
    image: breast-cancer-app:1.0
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://cancer:cancer@postgres:5432/cancerdb
      REDIS_URL: redis://redis:6379/0
      # Set ONNX_MODEL_PATH=models/model.onnx to serve with ONNX Runtime (empty = scikit-learn)
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ui:
    build: *app-build
    image: breast-cancer-app:1.0
    command: ["streamlit", "run", "app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
